  </head><body class="bg-background font-body-lg text-body-lg text-on-surface antialiased min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-background pt-safe pb-safe"><div class="flex flex-col w-full px-margin-mobile pb-space-lg select-none">
<!-- Top Reassuring Brand Anchor -->
<div class="flex flex-col items-center justify-center pt-space-md pb-space-sm text-center">
<div class="inline-flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-secondary-container shadow-sm">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-secondary-container tracking-tight">MamieMédoc</span>
</div>
<!-- Soft Ambient Warmth Illustration Badge -->
<div class="mt-space-md relative w-20 h-20 rounded-full bg-surface-container-low shadow-sm flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Gentle oil-painting style illustration of a loving intergenerational family sharing tea with serene warm green and cream daylight, conveying reassuring safety, soft domestic peace, and multi-generational healthcare support" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXvqM_2vFEj23XZKktpn1hGL1-J9WhTYLeQ7LMF95vV7XIsVuQ6AgeNqzDooqquJZtlKcqp2Bv5xeg621JxB-XdMc8ICFiGM8tt85b2wGo_7xZw6d9GJZ1hLy1ZOM1ZYhJTlrgn-PIrSTcstghpS5HG7NHIl8ZAk1G3I7d0UEa9kzj9mkm_g7k3OW5T2QQU5ITpR5jiGh9gdVhogLU7R4yVPFsrKi0YHXWkKNyVk4"/>
<div class="absolute inset-0 bg-primary/10 mix-blend-multiply pointer-events-none"></div>
</div>
<!-- Emotional Greeting Hierarchy -->
<h1 class="mt-space-sm font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold tracking-tight">
      Welcome back
    </h1>
<p class="mt-space-xs font-body-lg text-body-lg text-on-surface-variant max-w-xs">
      Log in to your family space.
    </p>
</div>
<!-- Reassuring Note Pill -->
<div class="w-full mb-space-sm">
<div class="flex items-center justify-center gap-space-xs py-space-xs px-space-sm rounded-full bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">diversity_1</span>
<span class="font-label-md text-label-md font-medium text-center">One family space, then pick your profile.</span>
</div>
</div>
<!-- Sign In Form Container -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm space-y-space-md">
<form class="space-y-space-md" id="signin-form" onsubmit="event.preventDefault(); triggerSignInSuccess();">
<!-- Field 1: Email Address -->
<div class="space-y-space-xs">
<label class="block font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight" for="family-email">
          Email
        </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-[58px] px-space-md pr-12 rounded-lg bg-surface-container-low font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest shadow-inner transition-colors duration-200" id="family-email" name="email" placeholder="jeanne.family@example.com" required="" type="email" value="jeanne.family@example.com"/>
<div class="absolute right-4 text-primary pointer-events-none flex items-center">
<span class="material-symbols-outlined text-[24px]">mail</span>
</div>
</div>
</div>
<!-- Field 2: Family Passcode -->
<div class="space-y-space-xs">
<div class="flex justify-between items-baseline">
<label class="block font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight" for="family-password">
            Password
          </label>
<button class="font-label-md text-label-md text-primary font-semibold py-1 px-2 rounded-full focus:outline-none active:opacity-75" type="button">
            Forgot?
          </button>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-[58px] px-space-md pr-14 rounded-lg bg-surface-container-low font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest shadow-inner tracking-widest transition-colors duration-200" id="family-password" name="password" placeholder="••••••••••••" required="" type="password" value="MamieCherie2024"/>
<button aria-label="Toggle password visibility" class="absolute right-2 w-11 h-11 flex items-center justify-center text-outline-variant hover:text-on-surface focus:outline-none active:scale-95 transition-transform" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[24px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Feedback Banner (Hidden by default) -->
<div class="hidden flex items-center gap-space-xs p-space-sm rounded-lg bg-secondary-container text-on-secondary-container" id="signin-alert">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span class="font-body-md text-body-md font-semibold">Connecting to Jeanne's family circle...</span>
</div>
<!-- Main Action Button -->
<button class="w-full min-h-[58px] rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm font-bold shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs focus:outline-none" id="submit-btn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
</form>
<!-- Create Family Space Link -->
<div class="pt-space-xs text-center">
<button class="inline-flex items-center justify-center min-h-[48px] px-space-sm rounded-full text-center text-primary font-label-lg text-label-lg font-bold hover:underline focus:outline-none" type="button">
        New here? Create your family space
      </button>
</div>
<!-- Divider Decorator -->
<div class="relative py-space-xs flex items-center justify-center">
<div class="w-full h-[1px] bg-surface-container-high"></div>
<span class="absolute bg-surface-container-lowest px-space-sm font-label-md text-label-md text-outline">or</span>
</div>
<!-- Secondary Demo Account Button -->
<button class="w-full min-h-[56px] rounded-full bg-secondary-container/40 text-primary font-label-lg text-label-lg font-bold shadow-sm hover:bg-secondary-container/60 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs focus:outline-none" onclick="fillDemoAccount()" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span>Try the demo account</span>
</button>
</div>
<!-- Trust & Assisted Help Footer -->
<div class="mt-space-md flex flex-col items-center justify-center space-y-space-xs text-center px-space-sm">
<p class="font-label-md text-label-md text-outline">
      Demo with invented data.
    </p>
<div class="flex items-center justify-center gap-2 pt-space-xs text-outline">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-md text-label-md">Encrypted multi-generational care space</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('family-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function fillDemoAccount() {
    const email = document.getElementById('family-email');
    const pwd = document.getElementById('family-password');
    if (email && pwd) {
      email.value = 'jeanne.grandma@mamiedoc.fr';
      pwd.value = 'BonheurSoleil82';
      
      const btn = document.getElementById('submit-btn');
      if (btn) {
        btn.classList.add('scale-105');
        setTimeout(() => btn.classList.remove('scale-105'), 200);
      }
    }
  }

  function triggerSignInSuccess() {
    const alertBox = document.getElementById('signin-alert');
    const submitBtn = document.getElementById('submit-btn');
    if (alertBox) {
      alertBox.classList.remove('hidden');
    }
    if (submitBtn) {
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[24px]">progress_activity</span>
        <span>Entering space...</span>
      `;
    }
  }
</script></main></body></html>
