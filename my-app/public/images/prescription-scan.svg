<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Printed prescription lying on a wooden desk">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c58a4f"/>
      <stop offset="0.55" stop-color="#9c6332"/>
      <stop offset="1" stop-color="#6b3e1d"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#fff4dc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e3dccd"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#desk)"/>
  <g stroke="#5a3215" stroke-opacity="0.18" fill="none" stroke-width="2">
    <path d="M-20 60 C 200 40, 420 110, 820 70"/>
    <path d="M-20 140 C 220 120, 460 190, 820 150"/>
    <path d="M-20 230 C 240 210, 480 280, 820 240"/>
    <path d="M-20 320 C 260 300, 500 370, 820 330"/>
    <path d="M-20 410 C 280 390, 520 460, 820 420"/>
  </g>

  <!-- Books and mug in the background -->
  <rect x="560" y="0" width="34" height="90" rx="3" fill="#3f4a3a"/>
  <rect x="598" y="0" width="28" height="80" rx="3" fill="#6b5a45"/>
  <rect x="630" y="0" width="38" height="96" rx="3" fill="#2f3b45"/>
  <ellipse cx="730" cy="118" rx="44" ry="14" fill="#000" opacity="0.2"/>
  <rect x="690" y="40" width="80" height="78" rx="12" fill="#e9e1d3"/>
  <ellipse cx="730" cy="42" rx="40" ry="10" fill="#cfc4b0"/>
  <path d="M770 60 q26 8 0 40" stroke="#e9e1d3" stroke-width="9" fill="none"/>

  <!-- Prescription sheet -->
  <g transform="rotate(-24 400 250)">
    <rect x="262" y="70" width="290" height="372" rx="4" fill="#000" opacity="0.22" transform="translate(10 12)"/>
    <rect x="262" y="70" width="290" height="372" rx="4" fill="url(#paper)"/>
    <g fill="#4a4a52">
      <rect x="370" y="96" width="130" height="7" rx="3"/>
      <rect x="292" y="126" width="110" height="5" rx="2" opacity="0.7"/>
      <rect x="292" y="140" width="150" height="5" rx="2" opacity="0.7"/>
      <rect x="292" y="154" width="90" height="5" rx="2" opacity="0.7"/>
    </g>
    <g stroke="#2d3561" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M296 196 c8 -8 14 6 22 -2 s14 6 22 -2 s14 6 24 -2 s16 6 26 -1 s18 5 30 -2"/>
      <path d="M296 222 c10 -7 16 6 26 -2 s16 6 26 -2 s14 6 22 -2 s18 5 34 -1"/>
      <path d="M296 248 c8 -8 14 6 22 -2 s14 6 22 -2 s14 6 24 -2 s16 6 26 -1 s20 5 40 -2"/>
      <path d="M296 274 c10 -7 16 6 26 -2 s16 6 26 -2 s20 5 38 -1"/>
      <path d="M296 300 c8 -8 14 6 22 -2 s14 6 22 -2 s16 6 30 -1"/>
      <path d="M396 352 c10 -14 18 10 28 -4 s16 12 30 -4 s14 8 34 -2"/>
    </g>
    <circle cx="330" cy="380" r="24" fill="none" stroke="#7a6f62" stroke-width="3" opacity="0.6"/>
    <circle cx="330" cy="380" r="15" fill="#7a6f62" opacity="0.25"/>
    <rect x="404" y="372" width="96" height="34" rx="2" fill="none" stroke="#4a4a52" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- Pen -->
  <g transform="rotate(-62 560 330)">
    <rect x="470" y="322" width="190" height="14" rx="7" fill="#1d1f24"/>
    <rect x="640" y="322" width="22" height="14" rx="3" fill="#c9a44c"/>
    <path d="M470 322 l-22 7 l22 7 z" fill="#c9a44c"/>
  </g>

  <rect width="800" height="450" fill="url(#light)"/>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
